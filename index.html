<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartal Şehir Hastanesi Nöbet Programı v5.3</title>
<style>
  :root {
    --bg: #8d9bb0; --card: #bac6d6; --line: #55657b; --text: #070d14; --muted: #28343f;
    --accent: #082f5c; --accent-soft: #8fb0d6; --hol: #d9a06a; --hol-strong: #bd7236;
    --bad: #d98686; --bad-line: #8a1010; --ok: #8cc29a; --lock: #9c6a00; --exc: #a52424;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); }
  #topbar { position: sticky; top: 0; z-index: 40; box-shadow: 0 5px 14px rgba(0,0,0,.45); }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 20px; background: #04152b; color: #fff; border-bottom: 1px solid #020c1a; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 18px; margin: 0; color: #fff; letter-spacing: .2px; }
  header .month { display: flex; align-items: center; gap: 6px; }
  header .month button { background: #0a2d56; color: #fff; border-color: #27598f; }
  header .month button:hover { background: #174d85; border-color: #8fb6e0; }
  header .month b { min-width: 120px; text-align: center; font-size: 16px; }
  #signR .ver, header h1 .ver { font-size: 11px; font-weight: 400; color: #9fb8d4; letter-spacing: 0; margin-left: 4px; vertical-align: baseline; }
  #saveStatus { color: #c3d3e6; font-size: 12px; margin-left: auto; }
  .duo { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .duocol { flex: 1 1 520px; min-width: 0; }
  .duo.wide .duocol { flex-basis: 780px; }
  #eLogo, #eLogo2 { width: 34px; height: 34px; flex: none; animation: eBlink 1.7s infinite; }
  #eLogo { margin-right: -6px; }
  #signR { display: flex; align-items: baseline; gap: 10px; padding-left: 8px; }
  #signR .nm { font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #000; opacity: .55; }
  @keyframes eBlink {
    0%, 58% { opacity: 1; filter: drop-shadow(0 0 3px #ff3c3c) drop-shadow(0 0 10px rgba(255,40,40,.9)); }
    62%, 100% { opacity: .3; filter: none; }
  }
  @media (prefers-reduced-motion: reduce) { #eLogo, #eLogo2 { animation: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); } }
  nav { display: flex; gap: 6px; padding: 10px 20px 0; background: linear-gradient(#7b8ca3, #667790); border-bottom: 4px solid #082f5c; flex-wrap: wrap; box-shadow: inset 0 3px 6px rgba(0,0,0,.3); }
  nav button { border: 1px solid #3f5068; border-bottom: 0; border-radius: 10px 10px 0 0; padding: 9px 18px 8px; font-size: 14px; font-weight: 600; cursor: pointer; color: #0b1622;
    background: linear-gradient(#d9e1ec 0%, #aebccf 55%, #93a4ba 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 1px 0 0 rgba(255,255,255,.4), inset -1px 0 0 rgba(0,0,0,.15), 0 -3px 6px rgba(0,0,0,.3); }
  nav button:hover { background: linear-gradient(#e8eef6 0%, #bfcbdb 55%, #a3b3c7 100%); }
  nav button.active { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); border-color: #02142c; padding-bottom: 12px; margin-bottom: -4px;
    background: linear-gradient(#2272c2 0%, #0d478a 50%, #082f5c 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 1px 0 0 rgba(255,255,255,.15), 0 -4px 10px rgba(0,0,0,.45); }
  main { padding: 20px; }
  .tab { display: none; }
  .tab.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 4px 10px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.35); }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .card h3 { font-size: 14px; margin: 16px 0 6px; }
  .hint { color: var(--muted); margin: 4px 0 10px; line-height: 1.45; }
  button, .btn { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: #cfd8e4; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:disabled { opacity: .6; cursor: wait; }
  button.danger { color: var(--bad-line); }
  input[type=text], input[type=number], select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: #cfd8e4; }
  input[type=number] { width: 60px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  th { background: #8797ad; font-weight: 600; }
  td.name, th.name { text-align: left; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
  .badge.ok { background: var(--ok); color: #1b5a27; }
  .badge.warn { background: var(--hol); color: #7d3a07; }

  /* Mazeret ızgarası */
  .grid td.day { width: 26px; min-width: 26px; height: 26px; padding: 0; cursor: pointer; user-select: none; }
  .grid th.day { width: 26px; min-width: 26px; padding: 2px 0; font-size: 11px; line-height: 1.2; }
  .grid .hol { background: var(--hol); }
  .grid th.hol { background: var(--hol-strong); }
  .grid td.day.x { background: var(--exc); color: #fff; font-weight: 700; }
  .grid td.day.x::after { content: "✕"; }
  .grid tr.holrow td.day { cursor: pointer; font-size: 13px; }
  .grid tr.holrow td.day.on::after { content: "★"; color: #c0600c; }
  .grid tr.xrow td.day { cursor: pointer; font-size: 13px; }
  .grid tr.xrow td.day.on { background: #9c7bd0; }
  .grid tr.xrow td.day.on::after { content: "★"; color: #5b2f9e; }
  .grid tr.srow td.day { cursor: pointer; font-size: 13px; }
  .grid tr.srow td.day.on { background: #d27f7f; }
  .grid tr.srow td.day.on::after { content: "✂"; color: #8a1c1c; }
  .grid tr.srow td.day.auto { cursor: not-allowed; background: #8e9db1; }
  .cal td.cn.cskip { background: #8e9db1; color: #3a4756; }
  .sched tr.xt td.date { box-shadow: inset 4px 0 0 #7a4cc2; }
  .sched td.cov { background: #8e9db1; color: #2b3744; font-size: 12px; text-align: left; padding: 2px 6px; }
  .cal td.cn.cxt { box-shadow: inset 0 -3px 0 #5b2f9e; }
  .grid tr.group td { background: #9aa9bd; text-align: left; font-weight: 600; }

  /* Çizelge */
  .sched td, .sched th { padding: 2px 4px; }
  .sched tr.hol td { background: var(--hol); }
  .sched td.date { white-space: nowrap; text-align: left; }
  .sched td.cell { min-width: 120px; }
  .sched td.cell select { width: 100%; border-color: transparent; background: transparent; color: var(--text); }
  .sched td.cell.locked select { border: 2px solid var(--lock); }
  .sched td.cell.bad { background: var(--bad) !important; }
  .sched td.cell.bad select { color: var(--bad-line); font-weight: 600; }
  .sched td.na { background: #7f8fa5; color: #3f4c5c; }
  .sched th.grp { background: #7c8fa8; }
  .problems { margin: 10px 0; padding: 10px 14px; border-radius: 6px; line-height: 1.5; }
  .problems.bad { background: var(--bad); border: 1px solid #a35656; }
  .problems.warn { background: var(--hol); border: 1px solid var(--hol-strong); }
  .problems.ok { background: var(--ok); border: 1px solid #8cc398; }
  .problems ul { margin: 4px 0 0; padding-left: 20px; }
  .progress { height: 6px; background: #6f7d90; border-radius: 3px; overflow: hidden; width: 240px; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .stats td.num { min-width: 34px; }
  .stats td.sub { color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 14px; color: var(--muted); }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); }
  .printonly { display: none; }
  .cal table { table-layout: fixed; border-collapse: collapse; }
  .cal th, .cal td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .cal th.ch { background: #a8431f !important; border: 1px solid #000; }
  .cal td.cn { background: #6b93c0; border: 1px solid #000; font-weight: 700; text-align: center; padding: 1px; }
  .cal td.cn.chol { background: #cd7a43; }
  .cal td.cn.cempty { background: #fff; }
  .cal td.ce, .cal td.ct { border: 0; text-align: left; padding: 1px 2px; font-size: 7.5px; line-height: 1.15; white-space: nowrap; overflow: hidden; height: 11px; }
  .cal .hr { font-size: 5.8px; font-weight: 700; margin-left: 1px; color: #1b2733; }
  .cal td.ce { border-left: 1px solid #000; border-right: 1px dotted #888; }
  .cal td.ct { border-right: 1px solid #000; }
  .cal tr.clast td { border-bottom: 1px solid #000; }
  .cal table { width: 100%; }
  .calview { overflow-x: auto; }
  .calview table { min-width: 1150px; }
  button { background: linear-gradient(#dfe6ef, #aab9cc); border-color: #4b5c73; box-shadow: 0 2px 0 #3a495e, 0 3px 5px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.75); }
  button:active { transform: translateY(2px); box-shadow: 0 0 0 #3a495e, inset 0 2px 4px rgba(0,0,0,.3); }
  button.primary { background: linear-gradient(#2272c2, #082f5c); border-color: #02142c; box-shadow: 0 2px 0 #02142c, 0 3px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4); }
  header .month button { background: linear-gradient(#1a5a9e, #0a2d56); border-color: #02142c; box-shadow: 0 2px 0 #02142c, inset 0 1px 0 rgba(255,255,255,.3); }
  input[type=text], input[type=number], select { box-shadow: inset 0 2px 3px rgba(0,0,0,.22); border-color: #4b5c73; }
  @media print {
    #topbar { position: static; box-shadow: none; }
    button, .card, nav button { box-shadow: none !important; }
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; font-size: 11px; }
    header, nav, .noprint, .tab:not(#tab-cizelge) { display: none !important; }
    main { padding: 0; }
    .card { border: 0; padding: 0; }
    .printonly { display: block; }
    .printonly table { width: 100%; }
    .printonly th, .printonly td { border: 1px solid #888; padding: 3px 4px; }
    .printonly tr.hol td { background: #fdeee2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .cal h2 { margin: 0 0 2mm; font-size: 13px; }
    .cal table { width: 100%; }
    .cal th.ch { font-size: 9px; height: 6mm; padding: 0; }
    .cal td.ce, .cal td.ct { font-size: 6.4px; height: var(--rh, 5mm); padding: 0 1px; vertical-align: middle; line-height: 1; }
    .cal .hr { font-size: 5px; }
    .cal td.cn { font-size: 8px; height: 4.6mm; padding: 0 1px; }

  }
</style>
</head>
<body>
<div id="topbar">
<header>
  <svg id="eLogo" viewBox="0 0 32 32" role="img" aria-label="Nöbetçi eczane" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="30" height="30" rx="6" fill="#fff"/>
    <rect x="3.2" y="3.2" width="25.6" height="25.6" rx="4" fill="#e01820"/>
    <path fill="#fff" d="M10.2 7.6h12.1v3.5h-7.9v3.6h6.9v3.5h-6.9v3.8h8.1v3.5H10.2z"/>
  </svg>
  <h1>Kartal Şehir Hastanesi Nöbet Programı</h1>
  <svg id="eLogo2" viewBox="0 0 32 32" role="img" aria-label="Nöbetçi eczane" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="30" height="30" rx="6" fill="#fff"/>
    <rect x="3.2" y="3.2" width="25.6" height="25.6" rx="4" fill="#e01820"/>
    <path fill="#fff" d="M10.2 7.6h12.1v3.5h-7.9v3.6h6.9v3.5h-6.9v3.8h8.1v3.5H10.2z"/>
  </svg>
  <div class="month">
    <button onclick="shiftMonth(-1)" title="Önceki ay">◀</button>
    <b id="monthLabel"></b>
    <button onclick="shiftMonth(1)" title="Sonraki ay">▶</button>
    <span id="monthBadge"></span>
  </div>
  <span id="saveStatus"></span>
  <div id="signR">
    <span class="ver">v5.3</span>
    <span class="nm">Bora</span>
  </div>
  <div id="cloudOverlay" style="display:none;position:fixed;inset:0;background:rgba(141,155,176,.95);z-index:50;align-items:center;justify-content:center"><div style="background:#bac6d6;border:1px solid var(--line);border-radius:8px;padding:20px 26px;max-width:420px;text-align:center;line-height:1.5">Veriler buluttan yükleniyor…</div></div>
</header>
<nav>
  <button data-tab="personel" onclick="showTab('personel')">1. Personel</button>
  <button data-tab="ay" onclick="showTab('ay')">2. Tatiller ve Mazeretler</button>
  <button data-tab="devir" onclick="showTab('devir')">3. Önceki Ay / Devir</button>
  <button data-tab="cizelge" onclick="showTab('cizelge')">4. Çizelge</button>
  <button data-tab="ayarlar" onclick="showTab('ayarlar')">Ayarlar</button>
</nav>
</div>
<main>
  <section class="tab" id="tab-personel"></section>
  <section class="tab" id="tab-ay"></section>
  <section class="tab" id="tab-devir"></section>
  <section class="tab" id="tab-cizelge"></section>
  <section class="tab" id="tab-ayarlar"></section>
</main>

<script>
"use strict";
/* ================================================================
   Sabitler
   ================================================================ */
const LS_KEY = 'nobetCizelgesi2_v1';
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const DAYS_SHORT = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const ROLES = { E: 'Eczacı', T: 'Tekniker' };
const ROLE_HOURS = { E: [24, 14, 8], T: [24, 8] };
const TYPES = ['E24', 'E14', 'E8', 'T24', 'T8'];
const CATS = ['Per', 'Cum', 'Cmt', 'Paz'];
const CAT_LABEL = { Per: 'Perşembe', Cum: 'Cuma', Cmt: 'Cumartesi', Paz: 'Pazar' };
const CAT_H = 24; // Perşembe–Pazar takibi sadece 24 saatlik nöbetler için
const typeHours = t => +t.slice(1);
const typeLabel = t => ROLES[t[0]] + ' ' + t.slice(1) + ' saat';
const GAP_KEYS = ['24-24', '24-14', '24-8', '14-14', '14-8', '8-8'];
const HARD = 1e6;

function defaultState() {
  const now = new Date();
  const nm = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  return {
    version: 1,
    currentMonth: nm.getFullYear() + '-' + String(nm.getMonth() + 1).padStart(2, '0'),
    settings: {
      staffing: {
        weekday: { E24: 1, E14: 1, E8: 0, T24: 1, T8: 0 },
        holiday: { E24: 1, E14: 1, E8: 1, T24: 1, T8: 3 },
        extra: { E24: 1, E14: 1, E8: 1, T24: 1, T8: 1 }
      },
      gaps: { '24-24': 3, '24-14': 3, '24-8': 1, '14-14': 1, '14-8': 1, '8-8': 1 },
      weights: { points: 10, total: 6, perType: 3, yearly: 6, consecWeekend: 8, spread: 3 },
      extraShift: 1,
      maxPtsDev: 2,
      maxShiftDev: 0,
      adjStart: '2027-01',
      prevRule: true,
      effort: 'normal'
    },
    people: [],
    months: {},
    carry: {},
    prevDays: {},
    prevAdj: {},
    yearStart: {}
  };
}

/* ================================================================
   Kayıt / yükleme
   ================================================================ */
function mergeDefaults(s) {
  const d = defaultState();
  const ss = s.settings || {};
  return {
    version: 1,
    currentMonth: s.currentMonth || d.currentMonth,
    settings: {
      staffing: {
        weekday: Object.assign({}, d.settings.staffing.weekday, ss.staffing && ss.staffing.weekday),
        holiday: Object.assign({}, d.settings.staffing.holiday, ss.staffing && ss.staffing.holiday),
        extra: Object.assign({}, d.settings.staffing.extra, ss.staffing && ss.staffing.extra)
      },
      gaps: Object.assign({}, d.settings.gaps, ss.gaps),
      weights: Object.assign({}, d.settings.weights, ss.weights),
      extraShift: ss.extraShift != null ? +ss.extraShift : d.settings.extraShift,
      maxPtsDev: ss.maxPtsDev != null ? +ss.maxPtsDev : d.settings.maxPtsDev,
      maxShiftDev: ss.maxShiftDev != null ? +ss.maxShiftDev : d.settings.maxShiftDev,
      adjStart: ss.adjStart || d.settings.adjStart,
      prevRule: ss.prevRule != null ? !!ss.prevRule : d.settings.prevRule,
      effort: ss.effort || d.settings.effort
    },
    people: s.people || [],
    months: s.months || {},
    carry: s.carry || {},
    prevDays: s.prevDays || {},
    prevAdj: s.prevAdj || {},
    yearStart: s.yearStart || {}
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.version) return mergeDefaults(s); }
  } catch (e) { console.error(e); }
  return defaultState();
}
let state = loadState();
const nowHM = () => new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
function setStatus(text, bad) {
  const el = document.getElementById('saveStatus');
  el.textContent = text; el.style.color = bad ? 'var(--bad-line)' : ''; el.style.fontWeight = bad ? '600' : '';
}

/* ---- Bulut kaydı (Cloudflare'de yayındayken) ----
   Bilgisayardan dosya olarak açıldığında (file://) veriler sadece bu tarayıcıda tutulur.
   İnternet adresinden açıldığında veriler /api/state üzerinden bulutta saklanır;
   tarayıcıdaki kopya sadece hızlı açılış için önbellektir. */
const CLOUD = /^https?:$/.test(location.protocol) && (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || /[?&]bulut=1/.test(location.search));
const cloud = { loaded: !CLOUD, pending: false, timer: null, busy: false };
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { if (!CLOUD) { alert('Kayıt yapılamadı: ' + e.message); return; } }
  if (!CLOUD) { setStatus('Kaydedildi ' + nowHM()); return; }
  if (!cloud.loaded) return; // buluttan yükleme bitmeden buluta yazma
  cloud.pending = true; setStatus('Kaydediliyor…');
  clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 1200);
}
async function pushCloud() {
  if (cloud.busy) { cloud.timer = setTimeout(pushCloud, 500); return; }
  cloud.timer = null; cloud.busy = true;
  try {
    const r = await fetch('/api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state), credentials: 'same-origin', cache: 'no-store' });
    if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'oturum süresi dolmuş olabilir, sayfayı yenileyin' : 'sunucu ' + r.status);
    if (!cloud.timer) cloud.pending = false;
    setStatus('Buluta kaydedildi ' + nowHM());
  } catch (e) {
    setStatus('⚠ Buluta kaydedilemedi: ' + e.message, true);
    cloud.timer = setTimeout(pushCloud, 15000); // bağlantı gelince yeniden dene
  } finally { cloud.busy = false; }
}
async function loadCloud() {
  const ov = document.getElementById('cloudOverlay'); ov.style.display = 'flex';
  try {
    const r = await fetch('/api/state', { cache: 'no-store', credentials: 'same-origin' });
    if (r.status === 204) {
      // Bulutta henüz veri yok (ilk kullanım)
      cloud.loaded = true; setStatus('Bulut bağlantısı hazır');
      if (state.people.length) save();
    } else if (r.ok) {
      state = mergeDefaults(await r.json());
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* önbellek yazılamadı */ }
      cloud.loaded = true; setStatus('Buluttan yüklendi ' + nowHM());
      showTab(currentTab);
    } else {
      throw new Error(r.status === 401 || r.status === 403 ? 'giriş doğrulanamadı (' + r.status + ')' : 'sunucu ' + r.status);
    }
    ov.style.display = 'none';
  } catch (e) {
    ov.querySelector('div').innerHTML = '<b>Bulut verilerine ulaşılamadı.</b><br>' + esc(e.message) +
      '<br><br>İnternet bağlantınızı kontrol edip sayfayı yenileyin. Değişiklik yapmayın; bu durumda yapılan değişiklikler kaydedilmez.<br><br><button onclick="location.reload()">Sayfayı yenile</button>';
    setStatus('⚠ Bulut bağlantısı yok', true);
  }
}
window.addEventListener('beforeunload', e => { if (CLOUD && cloud.pending) { e.preventDefault(); e.returnValue = ''; } });

/* ================================================================
   Tarih yardımcıları
   ================================================================ */
const parseKey = k => k.split('-').map(Number);
const mkKey = (y, m) => y + '-' + String(m).padStart(2, '0');
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const weekdayOf = (y, m, d) => new Date(Date.UTC(y, m - 1, d)).getUTCDay();
const ordOf = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 864e5);

      for (let ti = 0; ti < NT; ti++) { const c = cnt[p * NT + ti]; tot += c; const df = c - target[p * NT + ti]; fT += df * df; }
      totA[p] = tot;
      const dv = pts[p] - (targetPts - aP[p]), dp = dv / 4; fP += dp * dp;
      const pLo = band.lo - aP[p], pHi = band.hi - aP[p];
      const ex = Math.max(pLo - pts[p], pts[p] - pHi);
      if (ex > 0.001) { fX += (ex / 2) * (ex / 2); if (pts[p] > pHi) over[p] = 1; else under[p] = 1; }
      if (isN[p]) { sN += tot; sqN += tot * tot; } else { sO += tot; sqO += tot * tot; }
    }
    if (nN) fTot += sqN - sN * sN / nN;
    if (nO) fTot += sqO - sO * sO / nO;
    // Vardiya sayısı bandı: aynı gruptaki herkes ortalamanın alt/üst tam sayısı ± izin verilen fark içinde
    const bandN = nN ? { lo: Math.floor(sN / nN + 1e-9) - maxShDev, hi: Math.ceil(sN / nN - 1e-9) + maxShDev } : null;
    const bandO = nO ? { lo: Math.floor(sO / nO + 1e-9) - maxShDev, hi: Math.ceil(sO / nO - 1e-9) + maxShDev } : null;
    const limO = nN ? shiftLimit(sN / nN, extraLim) : Infinity;
    for (let p = 0; p < n; p++) {
      if (!inA[p]) continue;
      const b = isN[p] ? bandN : bandO; const tot = totA[p];
      const cLo = b.lo - aC[p], cHi = Math.min(b.hi, isN[p] ? Infinity : limO) - aC[p];
      const ex = Math.max(cLo - tot, tot - cHi);
      if (ex > 0.001) { fX += ex * ex * 2; if (tot > cHi) over[p] = 1; else under[p] = 1; }
      // 24 saatlik nöbet sayısı da 24 tutabilenler arasında bant içinde olsun
      if (ti24 >= 0 && isN[p]) {
        const c = cnt[p * NT + ti24]; const lo24 = band24.lo - aC24[p], hi24 = band24.hi - aC24[p]; const e2 = Math.max(lo24 - c, c - hi24);
        if (e2 > 0.001) { fX += e2 * e2 * 2; if (c > hi24) over[p] = 1; else under[p] = 1; }
      }
    }
    let fY = 0;
    for (let ti = 0; ti < NT; ti++) {
      const L = eligList[ti]; if (L.length < 2 || hoursList[ti] !== CAT_H) continue;
      for (let c = 0; c < NC; c++) {
        let s = 0, sq = 0; const o = (ti * NC + c) * n;
        for (let j = 0; j < L.length; j++) { const v = H[o + L[j]] + ycnt[o + L[j]]; s += v; sq += v * v; }
        fY += sq - s * s / L.length;
      }
    }
    let con = 0;
    for (let p = 0; p < n; p++) for (let w = 0; w < NW - 1; w++) if (wk[p * NW + w] && wk[p * NW + w + 1]) con++;
    lastHard = unfilled + dup + gapV;
    lastSoft = wPts * fP + wExtra * fX + wPer * fT + wTot * fTot + wYr * fY + wCon * con + wSpr * spread;
    return Hw * lastHard + lastSoft;
  }

  // Arama: kural cezası düşük başlar, giderek artar (yerel tıkanmayı önler).
  // En iyi sonuç önce ihlal sayısına, sonra denge puanına göre seçilir.
  const rnd = x => Math.floor(Math.random() * x);
  let bestHard = Infinity, bestSoft = Infinity, best = null;
  const keepBest = () => {
    if (lastHard < bestHard || (lastHard === bestHard && lastSoft < bestSoft)) { bestHard = lastHard; bestSoft = lastSoft; best = assign.slice(); }
  };
  const assign = new Int16Array(NS);
  const total = iters * runs;
  // 1. aşama: önce hiçbir kuralı bozmayan bir çizelge bulunur (denge çok az önemsenir).
  // 2. aşama: kural ihlali asla artırılmadan denge iyileştirilir.
  for (let run = 0; run < runs; run++) {
    for (let si = 0; si < NS; si++) assign[si] = cand[si].length ? cand[si][rnd(cand[si].length)] : -1;
    evaluate(assign); let cH = lastHard, cS = lastSoft; keepBest();
    const itA = Math.floor(iters * 0.4);
    let phase = 1, itB0 = itA;
    const accept = (nH, nS, T) => {
      if (phase === 1) {
        const dl = (nH - cH) * 100 + (nS - cS) * 0.001;
        return dl <= 0 || Math.random() < Math.exp(-dl / T);
      }
      if (nH !== cH) return nH < cH;
      const dl = nS - cS; return dl <= 0 || Math.random() < Math.exp(-dl / T);
    };
    for (let it = 0; it < iters; it++) {
      if (it % 4000 === 0) { onProg((run * iters + it) / total); await new Promise(r => setTimeout(r, 0)); }
      if (phase === 1 && (cH === 0 || it >= itA)) { phase = 2; itB0 = it; }      const T = phase === 1 ? 3 * Math.pow(0.05, it / itA) : 40 * Math.pow(0.02 / 40, (it - itB0) / Math.max(1, iters - itB0));
      const mv = Math.random();
      if (cH > 0 && nConf > 0 && mv < 0.2) {
        // Onarım: kuralı bozan bir hücre için tüm adayları dene, en iyisini seç
        evaluate(assign);
        const si = conf[rnd(nConf)]; const c = cand[si]; if (c.length < 2) continue;
        let bH = Infinity, bS = Infinity, bp = assign[si], ties = 0;
        for (const p of c) {
          assign[si] = p; evaluate(assign);
          if (lastHard < bH || (lastHard === bH && lastSoft < bS)) { bH = lastHard; bS = lastSoft; bp = p; ties = 1; }
          else if (lastHard === bH && lastSoft === bS && Math.random() < 1 / ++ties) bp = p;
        }
        assign[si] = bp; evaluate(assign); cH = lastHard; cS = lastSoft;
      } else if (phase === 2 && mv < 0.15) {
        // Hedefli denge: bandın üstündeki kişiden bir nöbeti alıp altındakine (ya da başka birine) ver / takasla
        evaluate(assign);
        const os = []; for (let si = 0; si < NS; si++) if (assign[si] >= 0 && over[assign[si]] && cand[si].length > 1) os.push(si);
        const ups = []; for (let p = 0; p < n; p++) if (under[p]) ups.push(p);
        if (!os.length && !ups.length) continue;
        let s1, np;
        if (os.length && (!ups.length || Math.random() < 0.5)) {
          s1 = os[rnd(os.length)];
          const pool = cand[s1].filter(p => p !== assign[s1] && under[p]); const c = pool.length ? pool : cand[s1].filter(p => p !== assign[s1]);
          if (!c.length) continue; np = c[rnd(c.length)];
        } else {
          np = ups[rnd(ups.length)];
          const pool = []; for (let si = 0; si < NS; si++) if (assign[si] !== np && candMask[si * n + np] && (assign[si] < 0 || !under[assign[si]])) pool.push(si);
          if (!pool.length) continue; s1 = pool[rnd(pool.length)];
        }
        const a = assign[s1];
        assign[s1] = np; evaluate(assign);
        if (accept(lastHard, lastSoft, T)) { cH = lastHard; cS = lastSoft; } else { assign[s1] = a; continue; }
      } else if (mv < 0.5) {
        const si = rnd(NS); const c = cand[si]; if (!c.length) continue;
        const np = c[rnd(c.length)]; const old = assign[si]; if (np === old) continue;
        assign[si] = np; evaluate(assign);
        if (accept(lastHard, lastSoft, T)) { cH = lastHard; cS = lastSoft; } else { assign[si] = old; continue; }
      } else {
        // Takas: aynı gün farklı nöbet türleri arasında ya da farklı günler arasında
        const s1 = rnd(NS); let s2;
        if (mv < 0.65) { s2 = s1 + rnd(9) - 4; if (s2 < 0 || s2 >= NS || slotD[s2] !== slotD[s1]) continue; }
        else s2 = rnd(NS);
        if (s1 === s2) continue;
        const a = assign[s1], b = assign[s2];
        if (a < 0 || b < 0 || a === b) continue;
        if (!candMask[s1 * n + b] || !candMask[s2 * n + a]) continue;
        assign[s1] = b; assign[s2] = a; evaluate(assign);
        if (accept(lastHard, lastSoft, T)) { cH = lastHard; cS = lastSoft; } else { assign[s1] = a; assign[s2] = b; continue; }
      }
      if (cH <= bestHard) keepBest();
    }
  }
  onProg(1);
  return slots.map((s, si) => ({ d: s.d, t: s.t, i: s.i, pid: best[si] >= 0 ? persons[best[si]].id : null }));
}

/* ================================================================
   Kontrol (kural ihlalleri)
   ================================================================ */
function analyze(k) {
  const mo = state.months[k]; if (!mo || !mo.schedule) return null;
  const [y, m] = parseKey(k); const cov = covOf(k); const D = daysInMonth(y, m) + extOf(k); const S = state.settings;
  const hard = [], soft = [], bad = new Set();
  const shifts = {}; const tail = prevTail(k);
  for (const pid in tail) shifts[pid] = tail[pid].map(e => ({ d: e.off, h: e.h, cell: null }));
  for (let d = 1 + cov; d <= D; d++) {
    if (skipOf(k, d)) continue;
    const row = mo.schedule[d] || {}; const dt = dayTypeOf(k, d);
    for (const t of TYPES) {
      const arr = row[t] || []; const demand = +S.staffing[dt][t] || 0; const h = typeHours(t);
      for (let i = 0; i < Math.max(arr.length, demand); i++) {
        const cell = d + '|' + t + '|' + i; const pid = arr[i];
        if (!pid) { if (i < demand) { hard.push(fmtDay(k, d) + ' – ' + typeLabel(t) + ': boş kaldı'); bad.add(cell); } continue; }
        if (i >= demand) continue;
        const p = personById(pid);
        if (!p) { hard.push(fmtDay(k, d) + ' – silinmiş bir kişi atanmış'); bad.add(cell); continue; }
        if (p.role !== t[0] || !p.hours.includes(h)) { hard.push(p.name + ': ' + fmtDay(k, d) + ' – ' + typeLabel(t) + ' nöbetini tutamaz'); bad.add(cell); }
        if (excusedOn(k, pid, d)) { hard.push(p.name + ': ' + fmtDay(k, d) + ' mazeretli olduğu halde atanmış'); bad.add(cell); }
        (shifts[pid] = shifts[pid] || []).push({ d, h, cell });
      }
    }
  }
  const m1 = ordOf(y, m, 1);
  for (const pid in shifts) {
    const L = shifts[pid].sort((a, b) => a.d - b.d); const name = personName(pid);
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) {
      const dd = L[j].d - L[i].d; if (dd > 10) break;
      if (L[j].d < 1 + cov) continue;
      if (dd === 0) {
        hard.push(name + ': ' + fmtDay(k, L[j].d) + ' günü iki nöbete yazılmış');
        if (L[i].cell) bad.add(L[i].cell); if (L[j].cell) bad.add(L[j].cell);
      } else {
        const r = gapReq(L[i].h, L[j].h);
        if (dd < r) {
          hard.push(name + ': ' + fmtDay(k, L[i].d) + ' (' + L[i].h + ' s) ile ' + fmtDay(k, L[j].d) + ' (' + L[j].h + ' s) arasında en az ' + r + ' gün olmalı');
          if (L[i].cell) bad.add(L[i].cell); if (L[j].cell) bad.add(L[j].cell);
        }
      }
    }
    // Arka arkaya hafta sonu
    const weeks = new Map();
    for (const s of L) {
      const o = m1 - 1 + s.d; const wd = ((o + 4) % 7 + 7) % 7;
      if (wd === 6 || wd === 0) { const w = Math.floor((wd === 6 ? o : o - 1) / 7); if (!weeks.has(w)) weeks.set(w, s.d); }
    }
    const ws = [...weeks.keys()].sort((a, b) => a - b);
    for (let i = 0; i + 1 < ws.length; i++) if (ws[i + 1] === ws[i] + 1 && weeks.get(ws[i + 1]) >= 1) {
      soft.push(name + ': arka arkaya iki hafta sonu nöbet (' + fmtDay(k, weeks.get(ws[i])) + ' ve ' + fmtDay(k, weeks.get(ws[i + 1])) + ')');
    }
  }
  // Önceki ay aynı gün kuralı
  const prevImp = prevImportant(k);
  for (let d = 1 + cov; d <= D; d++) {
    if (skipOf(k, d)) continue;
    const row = mo.schedule[d] || {};
    for (const t of TYPES) (row[t] || []).forEach((pid, i) => {
      if (!pid) return; const c = prevRuleBlocks(prevImp, pid, t, k, d);
      if (c) { hard.push(personName(pid) + ': geçen ay da ' + CAT_LABEL[c] + ' 24 saat nöbet tuttu (' + fmtDay(k, d) + ')'); bad.add(d + '|' + t + '|' + i); }
    });
  }
  // Hakediş ve fazla vardiya uyarıları
  const st = monthStats(k); const adj = prevAdjust(k);
  for (const role of ['E', 'T']) {
    const g = groupAverages(k, role, st);
    for (const p of g.N.concat(g.O)) {
      const s = st[p.id] || { total: 0, pts: 0, cnt: {} }; const b = personBands(g, p, adj[p.id]);
      const note = adj[p.id] ? ' – önceki aydan düzeltmeli' : '';
      if (devOut(s.pts, b.pts)) soft.push(`${p.name}: hakediş ${s.pts} puan (kabul aralığı ${b.pts.lo}–${b.pts.hi}${note})`);
      if (devOut(s.total, b.cnt)) soft.push(`${p.name}: ${s.total} vardiya (kabul aralığı ${b.cnt.lo}–${b.cnt.hi}${note})`);
      const c24 = (s.cnt && s.cnt[role + 24]) || 0;
      if (canNormal(p) && devOut(c24, b.c24)) soft.push(`${p.name}: ${c24} adet 24 saat (kabul aralığı ${b.c24.lo}–${b.c24.hi}${note})`);
    }
  }
  return { hard, soft, bad };
}

let painting = null;
function renderMonthSetup() {
  const k = state.currentMonth; const [y, m] = parseKey(k); const D = daysInMonth(y, m); const mo = getMonth(k);
  const hol = d => isHoliday(k, d);
  let h = `<div class="card"><h2>${monthTitle(k)} – Tatil günleri ve mazeretler</h2>
    <p class="hint"><b>★ Tatil düzeni:</b> Tıklanan gün "tatil düzeni"ne geçer. Cumartesi, pazar ve 1 Ocak zaten tatil düzenindedir; resmi tatilleri ve hafta sonu gibi planlamak istediğiniz diğer günleri buradan işaretleyin. Tekrar tıklayınca normal güne döner.<br>
    <b>★ Ekstra çalışma:</b> İşaretlenen gün, Ayarlar'daki "Ekstra çalışma günü" kadrosuyla planlanır (o günün normal kadrosu yerine geçer). Gün tatil de olabilir, hafta içi de; hakediş puanı günün tatil/mesai durumuna göre hesaplanır.<br>

function groupAverages(k, role, st) {

const adjStart = () => state.settings.adjStart || '';

function personBands(g, p, a) {

async function unzipEntries(buf) {

}

async function importPeopleFile(file) {
  if (!file) return;
  try {
    const rows = /\.(csv|txt)$/i.test(file.name) ? readCsvRows(await file.text()) : await readXlsxRows(file);
    const existing = new Set(state.people.map(p => p.name.toLocaleLowerCase('tr-TR')));
    const seen = new Set(); const add = [], skip = [];
    rows.forEach((r, i) => {

      seen.add(key);

      const cTxt = String(r[2] || '').trim();

/* ---------- Takvim düzeni (Excel ve yazdırma için ortak) ---------- */
const DAYS_MON = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
function calendarData(k) {
  // weeks: [[{d, hol, E:[isim], T:[isim]} | null x7], ...], rowsPer: hücre satır sayısı
  const [y, m] = parseKey(k); const D0 = daysInMonth(y, m); const D = D0 + extOf(k); const mo = getMonth(k); const S = state.settings.staffing;
  const lists = d => {
    const row = dayRow(k, d); const dt = dayTypeOf(k, d); const r = { E: [], T: [] };
    if (skipOf(k, d) && d > covOf(k)) return r;
    for (const t of TYPES) { const n = +S[dt][t] || 0; for (let i = 0; i < n; i++) { const pid = (row[t] || [])[i]; r[t[0]].push(pid ? personName(pid) + ' (' + typeHours(t) + ')' : ''); } }
    return r;
  };
  let rowsPer = 1;
  for (const dt of ['weekday', 'holiday', 'extra']) for (const role of ['E', 'T']) rowsPer = Math.max(rowsPer, TYPES.filter(t => t[0] === role).reduce((a, t) => a + (+S[dt][t] || 0), 0));

  for (let d = 1; d <= D; d++) {
    const c = (weekdayOf(y, m, d) + 6) % 7;
    wk[c] = Object.assign({ d: d > D0 ? d - D0 : d, lbl: (d > D0 ? (d - D0) + ' ' + MONTHS[m % 12] : null), star: isExtra(k, d), skip: skipOf(k, d) && d > covOf(k), hol: isHoliday(k, d) }, lists(d));
    if (c === 6 || d === D) { weeks.push(wk); wk = Array(7).fill(null); }
  }

}
function calendarSheet(k) {
  const { weeks, rowsPer, title } = calendarData(k);
  const rows = [], merges = [];
  rows.push([{ v: title, s: 12 }]); merges.push('A1:N1');
  rows.push([]);
  const hdr = []; DAYS_MON.forEach((n, i) => { hdr.push({ v: n, s: 5 }, { v: '', s: 5 }); merges.push(colName(i * 2) + '3:' + colName(i * 2 + 1) + '3'); });
  rows.push(hdr);
  for (const w of weeks) {
    const r = rows.length + 1; const nr = [];
    w.forEach((c, i) => {
      const st = !c ? 13 : (c.hol ? 7 : 6);
      nr.push({ v: c ? ((c.lbl || c.d) + (c.star ? ' ★' : '') + (c.skip ? ' (planlanmadı)' : '')) : '', s: st }, { v: '', s: st });
      merges.push(colName(i * 2) + r + ':' + colName(i * 2 + 1) + r);
    });
    rows.push(nr);
    for (let j = 0; j < rowsPer; j++) {
      const last = j === rowsPer - 1; const cr = [];
      w.forEach(c => { cr.push({ v: c ? (c.E[j] || '') : '', s: last ? 10 : 8 }, { v: c ? (c.T[j] || '') : '', s: last ? 11 : 9 }); });
      rows.push(cr);
    }
  }
  return sheetXml(rows, Array(14).fill(22), merges);
}
// "Ad Soyad (24)" → ad normal, saat küçük punto
function calName(s) {

  return mm ? `<span class="nm">${esc(mm[1])}</span><span class="hr">(${mm[2]})</span>` : esc(s || '');
}
function renderPrintCalendar(k, screen) {
  const { weeks, rowsPer, title } = calendarData(k);
  // A4 yatay sayfayı (içerik yüksekliği ≈170 mm) dolduracak satır yüksekliği
  const rh = Math.max(3, Math.min(10, (170 - 6 - 4.6 * weeks.length) / (weeks.length * Math.max(1, rowsPer))));
  let h = `<div style="--rh:${rh.toFixed(2)}mm" class="${screen ? 'calview' : 'printonly'} cal"><h2 style="text-align:center;text-decoration:underline">${title}</h2><table><tr>${DAYS_MON.map(n => `<th colspan="2" class="ch">${n}</th>`).join('')}</tr>`;
  for (const w of weeks) {
    h += '<tr>' + w.map(c => `<td colspan="2" class="cn ${c && c.hol ? 'chol' : ''} ${c && c.star ? 'cxt' : ''} ${c && c.skip ? 'cskip' : ''} ${c ? '' : 'cempty'}">${c ? esc(c.lbl || c.d) + (c.star ? ' ★' : '') + (c.skip ? ' (planlanmadı)' : '') : ''}</td>`).join('') + '</tr>';
    for (let j = 0; j < rowsPer; j++) {
      h += `<tr class="${j === rowsPer - 1 ? 'clast' : ''}">` + w.map(c => `<td class="ce">${c ? calName(c.E[j]) : ''}</td><td class="ct">${c ? calName(c.T[j]) : ''}</td>`).join('') + '</tr>';

function exportXlsx() {

    const list = activePeople(role); if (!list.length) continue; const hrs = ROLE_HOURS[role];
    const h = [{ v: ROLES[role], s: 1 }, ...hrs.map(x => ({ v: x + ' saat', s: 1 })), { v: 'Toplam', s: 1 }, { v: 'Hakediş', s: 1 }, { v: 'Mazeret gün', s: 1 }];
    for (const c of CATS) h.push({ v: `24s ${CAT_LABEL[c]} (yıl)`, s: 1 });
    r2.push(h);
    for (const p of list) {
      const s = st[p.id] || { cnt: {}, total: 0, cats: {}, pts: 0 }; const hi = hist[p.id] || {};
      const r = [{ v: p.name, s: 2 }, ...hrs.map(x => ({ v: s.cnt[role + x] || 0, s: 2 })), { v: s.total, s: 2 }, { v: s.pts, s: 2 }, { v: (mo.excuses[p.id] || []).length, s: 2 }];
      for (const x of [CAT_H]) for (const c of CATS) { const key = role + x + '|' + c; r.push({ v: (+hi[key] || 0) + (s.cats[key] || 0), s: 2 }); }
      r2.push(r);
    }
    r2.push([]);
  }
  const s2 = sheetXml(r2, [22, ...Array(30).fill(11)]);
  download('Nobet_Cizelgesi_' + k + '.xlsx', makeXlsx([{ name: 'Takvim', xml: calendarSheet(k) }, { name: 'Liste', xml: s1 }, { name: 'Özet', xml: s2 }]));
}

/* ================================================================ */
showTab(state.people.length ? 'ay' : 'personel');
if (CLOUD) loadCloud();
else if (!localStorage.getItem(LS_KEY)) save();
</script>
